[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polysolve"
authors = [{name = "", email = ""}]
requires-python = ">= 3.8"
readme = "README.md"
description = ""
license = {text = "BSD-3-Clause"}

keywords = [...]
dependencies = ["numpy"]
classifiers = [...]
dynamic = ["version"]

[project.optional-dependencies]
docs = ["sphinx",
	"sphinx_rtd_theme",
	"sphinx_autodoc_typehints"]

[project.urls]
Homepage="https://github.com/Valentina180/Polysolve.git"
Repository="https://github.com/Valentina180/Polysolve.git"

[tool.setuptools.dynamic]
version = {attr = "polysolve.__version__"}
